<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Josh Dicker | Full-Stack Developer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--bg-primary:#0a0a0b;
--bg-secondary:#111113;
--bg-card:#161619;
--text-primary:#fafafa;
--text-secondary:#8a8a8f;
--text-muted:#555;
--accent:#00ff88;
--accent-dim:rgba(0,255,136,.2);
--border:#222;
}

html{scroll-behavior:smooth}

body{
font-family:'Outfit',sans-serif;
background:var(--bg-primary);
color:var(--text-primary);
line-height:1.6;
overflow-x:hidden;
}

/* background atmosphere */
body::before{
content:'';
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
background-size:60px 60px;
z-index:-2;
}

.glow{
position:fixed;
width:600px;
height:600px;
background:radial-gradient(circle,var(--accent) 0%,transparent 60%);
filter:blur(140px);
opacity:.08;
top:-200px;
right:-200px;
z-index:-1;
}

/* header */
header{
position:fixed;
top:0;
left:0;
right:0;
display:flex;
justify-content:space-between;
align-items:center;
padding:22px 60px;
backdrop-filter:blur(18px);
background:rgba(10,10,11,.8);
border-bottom:1px solid var(--border);
z-index:100;
}

.logo{
font-family:'Space Mono',monospace;
font-weight:700;
font-size:18px;
letter-spacing:-1px;
}

.logo span{color:var(--accent)}

nav{display:flex;gap:32px}

nav a{
color:var(--text-secondary);
text-decoration:none;
font-size:14px;
transition:.3s;
position:relative;
}

nav a:hover{color:var(--text-primary)}

nav a::after{
content:'';
position:absolute;
left:0;
bottom:-6px;
width:0;
height:2px;
background:var(--accent);
transition:.3s;
}

nav a:hover::after{width:100%}

/* hero */
.hero{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
padding:160px 60px 120px;
max-width:1300px;
margin:auto;
}

.hero-tag{
font-family:'Space Mono',monospace;
color:var(--accent);
letter-spacing:3px;
font-size:12px;
margin-bottom:28px;
}

.hero h1{
font-size:clamp(52px,8vw,96px);
line-height:1.05;
letter-spacing:-3px;
margin-bottom:32px;
text-shadow:0 0 50px rgba(0,255,136,.15);
}

.highlight{
background:linear-gradient(135deg,#00ff88,#00ccff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero-desc{
color:var(--text-secondary);
font-size:20px;
max-width:620px;
margin-bottom:48px;
}

.hero-cta{display:flex;gap:18px;flex-wrap:wrap}

.btn{
padding:18px 36px;
border-radius:12px;
font-family:'Space Mono',monospace;
font-size:12px;
letter-spacing:1px;
text-transform:uppercase;
transition:.35s;
cursor:pointer;
text-decoration:none;
}

.btn-primary{
background:var(--accent);
color:#000;
}

.btn-primary:hover{
transform:translateY(-4px);
box-shadow:0 0 40px var(--accent-dim);
}

.btn-secondary{
border:1px solid var(--border);
color:var(--text-primary);
}

.btn-secondary:hover{
border-color:var(--accent);
background:var(--bg-secondary);
}

/* sections */
section{
padding:140px 60px;
max-width:1300px;
margin:auto;
}

.section-header{margin-bottom:80px}

.section-tag{
font-family:'Space Mono',monospace;
color:var(--accent);
letter-spacing:3px;
font-size:12px;
margin-bottom:16px;
}

.section-title{
font-size:clamp(36px,5vw,64px);
letter-spacing:-2px;
}

/* projects */
.projects-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
gap:40px;
}

.project-card{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:18px;
overflow:hidden;
transition:.4s;
}

.project-card:hover{
transform:translateY(-10px);
border-color:#333;
box-shadow:0 30px 80px rgba(0,0,0,.5);
}

.project-preview{
height:220px;
display:flex;
align-items:center;
justify-content:center;
font-size:60px;
background:linear-gradient(135deg,#1a1a1d,#222);
}

.project-content{padding:32px}

.project-name{
font-size:22px;
margin-bottom:10px;
}

.project-desc{
color:var(--text-secondary);
font-size:14px;
margin-bottom:20px;
}

.project-links{
display:flex;
gap:18px;
font-family:'Space Mono',monospace;
font-size:12px;
}

.project-links a{
color:var(--accent);
text-decoration:none;
}

.project-links a:hover{opacity:.7}

/* about */
.about-content{
display:grid;
grid-template-columns:1fr 1fr;
gap:100px;
}

.about-text p{
color:var(--text-secondary);
margin-bottom:24px;
}

.skills-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

.skill-item{
background:var(--bg-card);
border:1px solid var(--border);
padding:24px;
border-radius:14px;
text-align:center;
transition:.3s;
}

.skill-item:hover{
border-color:var(--accent);
transform:translateY(-4px);
}

/* contact */
.contact-content{text-align:center;max-width:650px;margin:auto}

.contact-content p{
color:var(--text-secondary);
font-size:18px;
margin-bottom:50px;
}

.contact-links{
display:flex;
justify-content:center;
gap:28px;
flex-wrap:wrap;
}

.contact-link{
display:flex;
align-items:center;
gap:12px;
padding:18px 34px;
border-radius:14px;
background:linear-gradient(145deg,#161619,#1c1c1f);
border:1px solid #2a2a2e;
text-decoration:none;
color:var(--text-primary);
font-family:'Space Mono',monospace;
font-size:13px;
letter-spacing:1px;
transition:.35s;
}

.contact-link svg{
width:20px;
height:20px;
stroke:currentColor;
flex-shrink:0;
transition:.3s;
}

.contact-link:hover{
border-color:var(--accent);
box-shadow:0 0 40px var(--accent-dim);
transform:translateY(-6px);
}

.contact-link:hover svg{transform:scale(1.2)}

/* footer */
footer{
padding:100px 40px;
text-align:center;
border-top:1px solid var(--border);
margin-top:160px;
background:linear-gradient(to top,#0a0a0b,#111);
}

footer p{
font-family:'Space Mono',monospace;
font-size:11px;
letter-spacing:1px;
color:var(--text-muted);
}

@media(max-width:900px){
.about-content{grid-template-columns:1fr}
.projects-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="glow"></div>

<header>
<div class="logo">JOSH<span>.</span>DEV</div>
<nav>
<a href="#projects">Projects</a>
<a href="#about">About</a>
<a href="#contact">Contact</a>
</nav>
</header>

<section class="hero">
<div class="hero-tag">Full-Stack Developer</div>
<h1>Quality tech for<br><span class="highlight">great businesses</span></h1>
<p class="hero-desc">I build software that solves real operational problems. Fast. Clean. Reliable.</p>
<div class="hero-cta">
<a href="#projects" class="btn btn-primary">View Projects</a>
<a href="#contact" class="btn btn-secondary">Get in Touch</a>
</div>
</section>

<footer>
<p>© 2026 Josh Dicker. Built to last.</p>
</footer>

</body>
</html>
